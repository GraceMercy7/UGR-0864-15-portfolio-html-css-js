<!DOCTYPE html>

<head>

    <title>Contact Me</title>
    <style>
        /* General Styles */
        body {
            background-color: #2b1b17;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-size: 2rem;
            text-transform: capitalize;
            color: white;
        }

        h1 span {
            color: #00bfff;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        form {
            background-color: #1c1c1c;
            width: 60%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .form-group input {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #555;
            color: white;
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #555;
            color: white;
            font-size: 16px;
            resize: none;
        }

        textarea::placeholder {
            color: #ccc;
        }

        .submit-btn {
            background-color: #00bfff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: capitalize;
        }

        .submit-btn:hover {
            background-color: #009acd;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            form {
                width: 80%;
            }

            .form-group {
                flex-direction: column;
            }

            .form-group input {
                width: 100%;
                margin-bottom: 10px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .submit-btn {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
