<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <style>
        body {
            background-color: #000000;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-size: 2rem;
            text-transform: capitalize;
        }

        .projects {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .thumbnail-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .thumbnail-row img {
            width: 200px;
            height: 120px;
            border: 2px solid white;
            border-radius: 5px;
        }

        .video-thumbnail {
            width: 400px;
            height: 240px;
            position: relative;
            border: 2px solid white;
            border-radius: 5px;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .play-button::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 15px solid white;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }
    </style>
</head>

        </div>

            <img src="../images/images4.jpg" alt="Video Project">
